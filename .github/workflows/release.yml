name: Release

# Three ways to cut a release:
#   - push a tag:              git tag v1.2.3 && git push origin v1.2.3
#   - push a release branch:   git push origin HEAD:release/v1.2.3   (the tag is created for you)
#   - run it from the Actions tab (workflow_dispatch) with a version
# Versions containing a hyphen (v1.2.3-beta) are published as pre-releases.
on:
  push:
    tags: ["v*"]
    branches: ["release/v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, e.g. v0.2.0 or v0.2.0-beta"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x64 }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, name: windows-arm64 }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-apple-silicon }
          - { os: macos-latest, target: x86_64-apple-darwin, name: macos-intel }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          v="${{ inputs.version }}"
          [ -n "$v" ] || v="${GITHUB_REF_NAME#release/}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "tiler-${{ steps.v.outputs.version }}-${{ matrix.name }}"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/${{ matrix.target }}/release/wm.exe, README.md, config.example.toml $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          dir="tiler-${{ steps.v.outputs.version }}-${{ matrix.name }}"
          mkdir "$dir"
          cp target/${{ matrix.target }}/release/wm README.md config.example.toml "$dir"
          tar czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            tiler-*.zip
            tiler-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ inputs.version }}"
          [ -n "$v" ] || v="${GITHUB_REF_NAME#release/}"
          (cd dist && sha256sum * > SHA256SUMS.txt)
          prerelease=""
          case "$v" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$v" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "tiler $v" --notes-file .github/release-notes.md $prerelease
